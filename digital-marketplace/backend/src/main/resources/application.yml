server:
  port: 8080

spring:
  application:
    name: digital-marketplace
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:marketplace}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, not Hibernate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

# ---- Secrets: NEVER hardcode these. Always injected via environment variables. ----
app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-256-bit-secret}
    expiration-ms: 86400000   # 24h
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:4200}
  storage:
    base-url: ${STORAGE_BASE_URL:http://localhost:8080/files}
    upload-dir: ${UPLOAD_DIR:./uploads}
  pricing:
    inr-amount: 4900     # in paise -> ₹49.00
    usd-amount: 1000     # in cents -> $10.00

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

stripe:
  api-key: ${STRIPE_SECRET_KEY:}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

logging:
  level:
    com.marketplace: INFO
